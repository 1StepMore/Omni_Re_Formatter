name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 ahead of GitHub's forced upgrade on 2026-06-16.
# When removed (post-2026-09-16), this env var becomes a no-op.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install "ruff==0.15.14"   # pinned to the version in uv.lock — ruff's default rule set changes across releases

      - name: Lint with ruff
        run: ruff check src/orf/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check with mypy
        run: mypy src/orf/ --ignore-missing-imports --disable-error-code=list-item --disable-error-code=arg-type --disable-error-code=assignment --disable-error-code=misc

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    needs: [lint, type-check]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install lxml weasyprint boto3 azure-storage-blob openai build fastmcp openpyxl moto

      - name: Create .venv_ol symlinks (tests hardcode the parent path)
        run: |
          # tests/test_apply_md_target_format.py:20 uses
          #   _OL_ROOT = parents[1] (= repo root) → _VENV = _OL_ROOT.parent/.venv_ol/bin/python
          # i.e. the path one level ABOVE the repo root. In CI the repo
          # lives at ${GITHUB_WORKSPACE}, so the parent is
          # $(dirname "$GITHUB_WORKSPACE").
          _real="$PWD/.venv_ol"
          mkdir -p "$_real/bin"
          ln -sfn "$(which python)" "$_real/bin/python"
          if [ -n "$GITHUB_WORKSPACE" ]; then
            ln -sfn "$GITHUB_WORKSPACE/.venv_ol" "$(dirname "$GITHUB_WORKSPACE")/.venv_ol" 2>/dev/null || true
          fi

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src/orf/ --cov-report=xml --cov-fail-under=50 --ignore=tests/test_orf_mcp_server.py --ignore=tests/test_e2e_omni_pipeline.py

  # Suite validation: ORF's own scenarios (orf-md/ + orf-xliff/ + tool-orf-*)
  # via the Omni Suite validation framework's per-module filter.
  # Hermetic (tier 1, no LLM keys, no mocks).
  validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Clone Omni Suite (engine + scenarios + fixtures)
        uses: actions/checkout@v4
        with:
          repository: renanzai40/OmniSuite_BackUp
          path: suite
          ref: main

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"

      - name: Verify uv.lock is up to date (fail-loud guard)
        run: uv --no-config lock --check

      - name: Install system deps (pandoc + weasyprint C libs for real conversions)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libcairo-gobject2 libgdk-pixbuf2.0-0 \
            shared-mime-info fontconfig

      - name: Clone 3 sub-repos into the suite (workspace members for uv sync)
        working-directory: suite
        run: bash scripts/clone_subrepos.sh

      - name: uv sync (root workspace)
        working-directory: suite
        run: uv sync --locked

      - name: Create .venv_ol symlink for legacy paths
        working-directory: suite
        run: ln -s .venv .venv_ol

      - name: Ensure .venv/bin/python exists
        working-directory: suite
        run: cd .venv/bin && [ ! -e python ] && [ -e python3 ] && ln -s python3 python; cd -

      - name: Install this repo's ORF over the cloned upstream (validate THIS HEAD)
        working-directory: suite
        run: |
          rm -rf Omni_Re_Formatter
          cp -r ${{ github.workspace }} Omni_Re_Formatter
          uv pip install --python .venv/bin/python -e ./Omni_Re_Formatter

      - name: Run ORF validation scenarios (tier 1, hermetic)
        working-directory: suite
        env:
          MCP_ALLOWED_DIRECTORIES: /tmp
          ORF_MCP_ALLOWED_DIRS: /tmp
          OMNI_RATE_LIMIT_RPM: "0"
        run: |
          .venv/bin/python scripts/validation/run_validation.py --module orf --tier 1
